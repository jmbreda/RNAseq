Name: "Koike_Science_2012"
Species: "mm10"
Promoterome: "/home/jbreda/Promoterome/resources/mm10/promoterome_blacklist_annotation.gff"
GenomeFiles:
    - genome.fa
    - gene_annotation.gtf
    - cdna.fa
URLs:
    gtf:    "ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M23/gencode.vM23.primary_assembly.annotation.gtf.gz"
    genome: "ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M23/GRCm38.primary_assembly.genome.fa.gz"
    cDNA:   "ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M23/gencode.vM23.transcripts.fa.gz"
ReadLength: 50
Strand:
    - forward
    - reverse
GenomeAligner:
    - star

star:
    Mapped:
        - Unique_rpm
        - UniqueMultiple_rpm
bwa:
    MAPQ_min: 10 # Minimum MAPQ score for reads to be considered (Phred-scaled)
    mem: "6G" # Memory for samtools sort
kallisto:
    fragment_length_sd: 5

BinSize:
    - 100
    - 1000
    - 10000

Chromosomes:
    - chr1
    - chr2
    - chr3
    - chr4
    - chr5
    - chr6
    - chr7
    - chr8
    - chr9
    - chr10
    - chr11
    - chr12
    - chr13
    - chr14
    - chr15
    - chr16
    - chr17
    - chr18
    - chr19
    - chrX
    - chrY
    - chrM
